services:
  pq1-tools:
    build:
      context: .
      dockerfile: Dockerfile.tools
    container_name: pq1-cht-tools
    working_dir: /workspace
    volumes:
      - ..:/workspace
      - ../..:/source:ro
      - ../../../police_quest2/workplace/scummvm-src:/upstream-scummvm:ro
      - ../../../simon-1/scummvm-src:/upstream-agi-scummvm:ro
      - ../../../police_quest2/workplace/patches:/pq2-patches:ro
      - ../../../police_quest2/workplace/tools:/pq2-tools:ro
      - ../../../police_quest2/workplace/translation:/pq2-translation:ro
      - ../../../larry_suit_leisure_suit/workplace/patches:/agi-patches:ro
    stdin_open: true
    tty: true

  # Windows 版交叉編譯環境。只掛 workplace 與兩個 upstream 樹，不需要 PQ2 那組來源。
  pq1-mingw:
    build:
      context: .
      dockerfile: Dockerfile.mingw
    container_name: pq1-cht-mingw
    working_dir: /workspace
    volumes:
      - ..:/workspace
      - ../..:/source:ro
      - ../../../police_quest2/workplace/scummvm-src:/upstream-scummvm:ro
      - ../../../simon-1/scummvm-src:/upstream-agi-scummvm:ro
    stdin_open: true
    tty: true

  # 推廣片合成。ffmpeg 相依約 400MB，跟 pq1-tools 分開以免每次建置都扛著。
  pq1-video:
    build:
      context: .
      dockerfile: Dockerfile.video
    container_name: pq1-cht-video
    working_dir: /workspace
    cpus: 2
    volumes:
      - ..:/workspace
      - ../..:/source:ro
    stdin_open: true
    tty: true
